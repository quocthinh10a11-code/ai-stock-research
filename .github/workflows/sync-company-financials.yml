name: Sync company financials

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated tickers to refresh (optional)"
        required: false
        default: ""
  schedule:
    # 20:17 Asia/Ho_Chi_Minh on weekdays, after exchange disclosure windows.
    - cron: "17 13 * * 1-5"
    # 08:17 Saturday catch-up for reports published late on Friday.
    - cron: "17 1 * * 6"

permissions:
  contents: read

concurrency:
  group: sync-company-financials
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-market-data.txt
      - run: pip install -r requirements-market-data.txt
      - name: Sync latest consolidated financial periods
        run: python scripts/sync_company_research.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          FUNDAMENTAL_SYMBOLS: ${{ inputs.symbols }}
          VNSTOCK_FINANCE_SOURCES: KBS,VCI
          VNSTOCK_FINANCE_REQUEST_DELAY_SECONDS: "4"
          VNSTOCK_INITIAL_DELAY_SECONDS: "0"
