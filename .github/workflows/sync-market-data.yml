name: Sync Vietnam market data

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated tickers to refresh (optional)"
        required: false
        default: ""
  schedule:
    - cron: "30 10 * * 1-5"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-market-data.txt
      - run: python scripts/sync_market_data.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MARKET_SYMBOLS: ${{ inputs.symbols }}
      - run: python scripts/sync_company_research.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FUNDAMENTAL_SYMBOLS: ${{ inputs.symbols }}
