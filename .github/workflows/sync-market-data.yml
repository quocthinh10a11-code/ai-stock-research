name: Sync Vietnam market data

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated tickers to refresh (optional)"
        required: false
        default: ""
  schedule:
    - cron: "30 10 * * 1-5"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-market-data.txt
      - run: pip install -r requirements-market-data.txt
      - run: python scripts/sync_market_data.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          MARKET_SYMBOLS: ${{ inputs.symbols }}
          VNSTOCK_REQUEST_DELAY_SECONDS: "5"
      - run: python scripts/sync_company_research.py
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          FUNDAMENTAL_SYMBOLS: ${{ inputs.symbols }}
          VNSTOCK_FINANCE_SOURCES: KBS,VCI
          VNSTOCK_FINANCE_REQUEST_DELAY_SECONDS: "4"
          VNSTOCK_INITIAL_DELAY_SECONDS: "30"
